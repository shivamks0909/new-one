<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <linearGradient id="bgGradTerm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="100%" stop-color="#FEE2E2" />
    </linearGradient>
    <linearGradient id="circleGradTerm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="dropShadowTerm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="300" height="240" rx="20" fill="url(#bgGradTerm)" />
  <circle cx="60" cy="50" r="20" fill="#EF4444" opacity="0.08" />
  <circle cx="240" cy="180" r="26" fill="#DC2626" opacity="0.08" />
  <circle cx="240" cy="60" r="8" fill="#F87171" opacity="0.25" />
  <circle cx="50" cy="170" r="10" fill="#EF4444" opacity="0.15" />

  <!-- Central Stop / Octagon Shield -->
  <circle cx="150" cy="115" r="62" fill="none" stroke="#FECACA" stroke-width="4" stroke-dasharray="6,4" />
  <circle cx="150" cy="115" r="52" fill="url(#circleGradTerm)" filter="url(#dropShadowTerm)" />

  <!-- X icon -->
  <path d="M136 101 L164 129 M164 101 L136 129" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Banner -->
  <g transform="translate(150, 178)">
    <rect x="-70" y="0" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5" />
    <text x="0" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle" letter-spacing="1">SCREENED OUT</text>
  </g>
</svg>