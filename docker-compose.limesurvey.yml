version: "3.8"

services:
  limesurvey-db:
    image: mysql:8.0
    container_name: oi-limesurvey-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-limesurvey_root_pw_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-limesurvey}
      MYSQL_USER: ${MYSQL_USER:-limesurvey}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-limesurvey_pw_change_me}
    volumes:
      - ls_mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-limesurvey_root_pw_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  limesurvey:
    image: domibag/limesurvey:latest
    container_name: oi-limesurvey
    restart: unless-stopped
    depends_on:
      limesurvey-db:
        condition: service_healthy
    environment:
      DB_HOST: limesurvey-db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-limesurvey}
      DB_USERNAME: ${MYSQL_USER:-limesurvey}
      DB_PASSWORD: ${MYSQL_PASSWORD:-limesurvey_pw_change_me}
      DB_TABLE_PREFIX: ""
      LS_ADMIN_USER: ${LS_ADMIN_USER:-admin}
      LS_ADMIN_PASSWORD: ${LS_ADMIN_PASSWORD:-admin123}
      LS_ADMIN_EMAIL: ${LS_ADMIN_EMAIL:-admin@opinioninsights.local}
    ports:
      - "${LS_PORT:-8080}:80"
    volumes:
      - ls_upload:/var/www/html/upload
      - ls_config:/var/www/html/application/config

volumes:
  ls_mysql_data:
  ls_upload:
  ls_config:
